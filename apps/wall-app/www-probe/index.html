<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kennko Wall Probe</title>
  <link rel="stylesheet" href="./scene/wall.css" />
  <style>
    body { margin: 0; background: #0055FF; color: #fff; font-family: system-ui, sans-serif; }
    #probe { position: fixed; inset: 0; display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; padding: 20px; box-sizing: border-box; }
    #stage { position: relative; background: #fff; border-radius: 16px; overflow: hidden; border: 4px solid #121212; }
    #wall { width: 100%; height: 100%; display: block; }
    #panel { display: flex; flex-direction: column; gap: 12px; font-size: 20px; line-height: 1.35; overflow: hidden; }
    #verdict { font-size: 44px; font-weight: 900; letter-spacing: 0.02em; padding: 12px 16px; border-radius: 12px; background: rgba(0,0,0,0.25); }
    #verdict.pass { background: #147a3d; }
    #verdict.fail { background: #b91c1c; }
    #details { font-size: 16px; background: rgba(0,0,0,0.2); padding: 12px 16px; border-radius: 12px; white-space: pre-wrap; }
    #overlay-btn { display: none; font-size: 20px; padding: 12px 20px; border-radius: 10px; border: 0; background: #FFB830; color: #121212; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <div id="probe">
    <div id="stage"><canvas id="wall"></canvas></div>
    <div id="panel">
      <div id="verdict">PROBING… 60s</div>
      <div id="status">Starting…</div>
      <div id="details"></div>
      <button id="overlay-btn" type="button">Grant Display over other apps</button>
    </div>
  </div>
  <script>
    setTimeout(function () {
      if (window.__probeStarted) return;
      var v = document.getElementById('verdict');
      var d = document.getElementById('details');
      v.className = 'fail';
      v.textContent = 'FAIL: WebView too old for ES modules';
      var p = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KennkoProbe;
      if (p && p.info) {
        p.info().then(function (info) {
          d.textContent = JSON.stringify({ info: info }, null, 2);
        });
      }
    }, 2000);
  </script>
  <script type="module" src="./probe.mjs"></script>
</body>
</html>
